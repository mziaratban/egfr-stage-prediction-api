global:

  scrape_interval: 15s

  evaluation_interval: 15s


rule_files:

  - "/etc/prometheus/recording_rules.yml"

  - "/etc/prometheus/alert_rules.yml"



scrape_configs:


  # Prometheus itself

  - job_name: "prometheus"

    static_configs:

      - targets:
          - prometheus:9090



  # FastAPI

  - job_name: "fastapi"

    metrics_path: /metrics

    static_configs:

      - targets:

          - fastapi:8000



  # Host metrics

  - job_name: "node"

    static_configs:

      - targets:

          - node-exporter:9100



  # Docker metrics

  - job_name: "cadvisor"

    static_configs:

      - targets:

          - cadvisor:8080