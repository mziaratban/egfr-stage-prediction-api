services:

  fastapi:
    image: ghcr.io/mziaratban/egfr-stage-prediction-api-fastapi:latest
    container_name: egfr-fastapi
    restart: unless-stopped

    ports:
      - "8000:8000"

    networks:
      - monitoring



  streamlit:
    image: ghcr.io/mziaratban/egfr-stage-prediction-api-streamlit:latest
    container_name: egfr-streamlit
    restart: unless-stopped

    depends_on:
      - fastapi

    ports:
      - "8501:8501"

    networks:
      - monitoring



  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

    networks:
      - monitoring



  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

    depends_on:
      - prometheus

    networks:
      - monitoring



  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped

    ports:
      - "9100:9100"

    command:
      - "--path.rootfs=/host"

    volumes:
      - "/:/host:ro,rslave"

    networks:
      - monitoring



volumes:

  prometheus_data:

  grafana_data:



networks:

  monitoring:
    driver: bridge
